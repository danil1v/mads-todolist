<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Listado de Equipos')"></head>
<body>
<div th:replace="fragments :: navbar"></div>

<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de equipos</h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th th:if="${usuario.admin}">Administración</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipo: ${equipos}">
                    <td th:text="${equipo.id}"></td>
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
                    </td>
                    <td th:if="${usuario.admin}">
                        <a class="btn btn-warning btn-sm" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
                        <button class="btn btn-danger btn-sm" th:onclick="'delEquipo(\'/equipos/' + ${equipo.id} + '\')'">Borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p><a class="btn btn-primary" th:href="@{/equipos/nuevo}">Nuevo equipo</a></p>
        </div>
    </div>
</div>

<script type="text/javascript">
    function delEquipo(urlDelEquipo) {
        if (confirm('¿Estás seguro/a de que quieres borrar este equipo?')) {
            fetch(urlDelEquipo, {
                method: 'DELETE'
            }).then((res) => location.reload());
        }
    }
</script>

<div th:replace="fragments::javascript"/>
</body>
</html>
