<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Detalle del Equipo')"></head>
<body>
<div th:replace="fragments :: navbar"></div>

<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Equipo: ' + ${equipo.nombre}"></h2>
            <hr/>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <h4>Miembros del equipo</h4>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Email</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m: ${miembros}">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.nombre != null ? m.nombre : 'Sin nombre'}"></td>
                    <td th:text="${m.email}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(miembros)}">
                    <td colspan="3" class="text-muted">Este equipo aún no tiene miembros asociados.</td>
                </tr>
                </tbody>
            </table>
            <p class="mt-3">
                <a class="btn btn-secondary" th:href="@{/equipos}">Volver al listado</a>
            </p>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript"/>
</body>
</html>
